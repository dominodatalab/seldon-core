name: V1 Executor Lint

on:
  push:
    branches: [ master, rabbitmq* ]
  pull_request:
    branches: [ master, rabbitmq*  ]

jobs:
  executor-lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v3
      with:
        go-version: '1.25.12'
    - name: test-executor
      env:
        GOTOOLCHAIN: go1.25.12
      run: |
        make -C executor lint
