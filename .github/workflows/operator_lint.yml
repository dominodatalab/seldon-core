name: V1 Operator Lint

on:
  push:
    branches: [ master, rabbitmq* ]
  pull_request:
    branches: [ master, rabbitmq*  ]

jobs:
  operator-lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-go@v3
      with:
        go-version: '1.24.12'
    - name: test-executor
      env:
        GOTOOLCHAIN: go1.24.12
      run: |
        make -C operator lint
