# Helm values for rabbitmq-ha chart in test environment
# Uses production chart but with minimal resources for testing

replicaCount: 1

# Image pull secrets for private registry
image:
  pullSecrets:
    - domino-quay-repos

# Minimal resources for test environment
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Service configuration
service:
  type: ClusterIP

# RabbitMQ configuration
rabbitmqUsername: rabbitmq
rabbitmqPassword: rabbitmq  # Simple password for tests
rabbitmqErlangCookie: test-cookie

# Extra config matching operator setup (rabbitmq.conf settings)
extraConfig: |
  log.console.level = info
  channel_max = 1500

# Definitions for RabbitMQ objects loaded at startup
definitions:
  users:
    - username: seldon
      secret: rabbitmq-ha.seldon
      tags: [management]
  permissions:
    - user: seldon
      vhost: "/"
      configure: ".*"
      write: ".*"
      read: ".*"
  vhosts:
    - name: "/"
    - name: "data-plane-service"  # Required by chart's default definitions
  queues:
    # Test queues
    - name: "iris-model-rabbitmq-input"
      vhost: "/"
      auto_delete: false
      durable: true
      arguments: {}
    - name: "iris-model-rabbitmq-output"
      vhost: "/"
      auto_delete: false
      durable: true
      arguments: {}
    - name: "cifar10-rest-input"
      vhost: "/"
      auto_delete: false
      durable: true
      arguments: {}
    - name: "cifar10-rest-output"
      vhost: "/"
      auto_delete: false
      durable: true
      arguments: {}
    # Required by chart's default bindings
    - name: "request.alt.1"
      vhost: "data-plane-service"
      auto_delete: false
      durable: true
      arguments:
        x-queue-type: "quorum"
        x-quorum-initial-group-size: 3
  exchanges:
    # Required by chart's default bindings
    - name: "request.alt.1"
      vhost: "data-plane-service"
      type: "fanout"
      durable: true
      auto_delete: false
      internal: false
  bindings:
    # Required binding from chart defaults
    - source: "request.alt.1"
      vhost: "data-plane-service"
      destination: "request.alt.1"
      destination_type: "queue"

# Disable persistence for faster tests (optional - can enable if needed)
persistentVolume:
  enabled: false

# Pod management
podManagementPolicy: Parallel

# Prometheus plugin (if needed for monitoring)
rabbitmqPrometheusPlugin:
  enabled: true

