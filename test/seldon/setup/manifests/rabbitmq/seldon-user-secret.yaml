# Kubernetes secret for seldon user credentials
# This secret is used by the rabbitmq-ha chart's definitions to create the seldon user
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-ha.seldon
  namespace: rabbitmq
type: Opaque
stringData:
  rabbitmq-username: seldon
  rabbitmq-password: seldon-password

---
# Compatibility secret for test scripts that expect seldon-user-user-credentials
# This matches the format expected by SeldonDeployment env vars
apiVersion: v1
kind: Secret
metadata:
  name: seldon-user-user-credentials
  namespace: seldon-regression-test
type: Opaque
stringData:
  username: seldon
  password: seldon-password

